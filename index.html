
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vincent Chen - Game Programmer Portfolio">
  <title>Vincent Chen | Game Programmer</title>

  <style>
    :root {
      --bg: #0c0e13;
      --surface: #171b24;
      --text: #f1f3f8;
      --muted: #a0a7b5;
      --accent: #8eaaff;
      --border: #2b3240;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 0 24px;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(12,14,19,.95);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 70px;
    }

    .logo { font-size: 20px; font-weight: 800; }

    .nav-links {
      display: flex;
      gap: 25px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-links a:hover,
    a:hover {
      color: var(--accent);
    }

    /* Section spacing */
    section {
      padding-top: 35px !important;
      padding-bottom: 35px !important;
    }

    .hero {
      padding-top: 35px !important;
      padding-bottom: 35px !important;
    }

    .eyebrow {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 13px;
    }

    h1 {
      font-size: clamp(44px, 8vw, 80px);
      line-height: 1.1;
      letter-spacing: -2px;
      margin: 15px 0;
    }

    /* Space between titles and content */
    h2 {
      font-size: 32px;
      margin: 0 0 40px;
    }

    h3 { margin: 0 0 10px; }

    p { color: var(--muted); }

    .intro {
      font-size: 19px;
      max-width: 650px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 30px;
    }

    .button {
      padding: 12px 22px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-weight: 600;
      transition: .2s;
    }

    .button.primary {
      background: var(--accent);
      color: #0c0e13;
      border-color: var(--accent);
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: .85;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-content { padding: 25px; }

    .project-image {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: var(--surface);
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .tag {
      font-size: 12px;
      color: var(--accent);
      background: #263149;
      padding: 5px 11px;
      border-radius: 5px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .skill {
      padding: 10px 17px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    footer {
      padding: 30px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        gap: 12px;
        font-size: 12px;
      }

      section {
        padding-top: 35px !important;
        padding-bottom: 35px !important;
      }

      .hero {
        padding-top: 35px !important;
        padding-bottom: 35px !important;
      }

      h2 {
        margin-bottom: 30px;
      }
    }
  </style>
  <script defer src="assets/vendor/marked/marked.umd.js"></script>
  <script defer src="assets/vendor/dompurify/purify.min.js"></script>
  <script defer src="assets/js/markdown.js"></script>
  <link rel="stylesheet" href="assets/markdown.css">
</head>

<body>
  <header>
    <nav class="container">
      <a href="#" class="logo">VC.</a>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </header>

  <noscript><p class="container">Enable JavaScript to read this portfolio.</p></noscript>
  <main>
    <section class="hero container" data-markdown="content/home/hero.md" aria-busy="true">
      <p role="status">Loading content…</p>
    </section>
    <section id="projects" class="container" data-markdown="content/home/projects.md" aria-busy="true">
      <p role="status">Loading content…</p>
    </section>
    <section id="skills" class="container" data-markdown="content/home/skills.md" aria-busy="true">
      <p role="status">Loading content…</p>
    </section>
    <section id="about" class="container" data-markdown="content/home/about.md" aria-busy="true">
      <p role="status">Loading content…</p>
    </section>
    <section id="contact" class="container" data-markdown="content/home/contact.md" aria-busy="true">
      <p role="status">Loading content…</p>
    </section>
  </main>

  <footer>
    <div class="container">
      &copy; 2026 Vincent Chen. Built with GitHub Pages.
    </div>
  </footer>
</body>
</html>
